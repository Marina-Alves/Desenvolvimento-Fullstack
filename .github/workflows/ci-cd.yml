name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Mais rápido e barato: falha cedo em estilo, code smells e duplicação.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: ESLint (relatório)
        run: npm run lint:report
      - name: Duplicação de código (jscpd)
        run: npm run dup
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: relatorio-analise-estatica, path: reports/, if-no-files-found: ignore }

  # 2) Testes do back-end: tipos + testes unitários/integração (Prisma mockado, sem banco).
  test-backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: Backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        with: { name: cobertura-backend, path: Backend/coverage/, if-no-files-found: ignore }

  # 3) Testes do front-end.
  test-frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: Frontend/package-lock.json }
      - run: npm ci
      - run: npm test -- --watchAll=false
        env: { CI: "true" }

  # 4) Só constrói a aplicação se lint e testes passaram; 5) prova que ela sobe e responde.
  build-and-smoke:
    needs: [lint, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        run: docker compose build
      - name: Subir a aplicação (Postgres + back-end + front-end)
        run: docker compose up -d
      - name: Teste de fumaça
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/people || true)
            [ "$code" = "200" ] && echo "back-end OK" && break
            sleep 2
          done
          [ "$code" = "200" ] || { docker compose logs backend; exit 1; }
          curl -fsS http://localhost:3000/ >/dev/null && echo "front-end OK"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - run: docker compose down -v

  # 6) Publica as imagens versionadas (apenas na main).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-smoke
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build e push (back-end e front-end)
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          for svc in Backend Frontend; do
            img=ghcr.io/$repo/$(echo $svc | tr '[:upper:]' '[:lower:]')
            docker build -t $img:${{ github.sha }} -t $img:latest ./$svc
            docker push $img:${{ github.sha }}
            docker push $img:latest
          done

  # 7) Entrega Contínua: o deploy em produção exige aprovação manual (environment "production").
  deploy-production:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        run: |
          echo "Imagens ghcr.io publicadas para o commit ${{ github.sha }}."
          echo "Aqui entraria o comando de deploy do ambiente real (ex.: docker compose pull && up -d, ou hook do provedor)."
