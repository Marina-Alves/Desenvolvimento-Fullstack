services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: devfullstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devfullstack"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/devfullstack?schema=public
      SERVER_PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_BACKEND_HOST: localhost
        REACT_APP_BACKEND_PORT: 5000
    depends_on:
      - backend
    ports:
      - "3000:80"
